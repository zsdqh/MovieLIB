{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block css_connection %}
<link rel="stylesheet" href="/static/css/users.css" />
{% endblock %}

{% block content %}
<div class="users-page container py-5" style="max-width: 420px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h1 class="h4 mb-4">Регистрация</h1>
      <form method="post" action="/register" class="vstack gap-3">
        <div>
          <label class="form-label" for="username">Логин</label>
          <input type="text" class="form-control" id="username" name="username" maxlength="30" minlength="3" required autocomplete="username" />
        </div>
        <div>
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" required autocomplete="email" />
        </div>
        <div>
          <label class="form-label" for="password">Пароль</label>
          <input type="password" class="form-control" id="password" name="password" minlength="8" maxlength="100" required autocomplete="new-password" />
        </div>
        <div>
          <label class="form-label" style="font-size: 14px;" for="confirmation"><input type="checkbox" id="confirmation" name="confirmation" required/> Я согласен с <a href="/static/rss/confirmation.pdf">обработкой персональных данных</a></label>
        </div>
        <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
      </form>
      <p class="text-center text-muted small mt-3 mb-0">
        Уже есть аккаунт? <a href="/login">Вход</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
