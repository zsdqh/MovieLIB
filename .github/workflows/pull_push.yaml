name: Lint and test
on: [push, pull_request]
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up python
        uses: actions/setup-python@v2
        with:
          python-version: 3.13

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1

      - name: Install Dependencies
        run: poetry install --no-root

      - name: Lint
        run: make lint
